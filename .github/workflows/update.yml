name: 更新資料並部署

on:
  schedule:
    - cron: "5,35 1-5 * * 1-5"
    - cron: "10 6 * * 1-5"
    - cron: "40 10 * * 1-5"
    - cron: "40 23 * * 0-4"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack any uploaded site zip
        run: |
          shopt -s nullglob
          for z in *.zip; do
            rm -rf _unpack && mkdir _unpack && unzip -q -o "$z" -d _unpack
            f=$(find _unpack -name index.html -not -path '*/.github/*' | head -n 1)
            if [ -n "$f" ]; then
              src=$(dirname "$f")
              rm -rf "$src/.github"
              cp -r "$src"/. .
            fi
            rm -rf _unpack "$z"
          done
      - name: Update data
        env:
          NOTIFY_DIR: ${{ runner.temp }}
        run: python3 scripts/update.py || echo "::warning::update failed, keeping previous data"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push || echo "::warning::push failed"
      - name: Notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/z2_title.txt" ]; then
            gh issue create --title "$(cat "$RUNNER_TEMP/z2_title.txt")" --body-file "$RUNNER_TEMP/z2_body.md" || echo "::warning::notify failed"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
